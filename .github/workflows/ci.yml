name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg and libsndfile
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          speech-stability-check make-synthetic /tmp/synth --n 2
          speech-stability-check run /tmp/synth -o /tmp/out -c spectral_gate_mild telephone_8k opus_12k
